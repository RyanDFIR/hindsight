# Builds one-file Hindsight binaries for Windows, Linux, and macOS with PyInstaller.
#
# Triggers on pushing a release tag (v*) — binaries are attached to the matching
# GitHub release (or a draft release is created if one doesn't exist yet), and the
# sdist + wheel are published to PyPI via trusted publishing (no token secret;
# requires the trusted publisher configured on PyPI for this repo/workflow with
# environment "pypi").
# Can also be run manually (workflow_dispatch) to get binaries as workflow artifacts
# without cutting a release (no PyPI publish).
#
# Notes:
# - Linux builds on the oldest available Ubuntu runner: PyInstaller binaries require
#   the build machine's glibc or newer, so older runner = wider compatibility.
# - macOS binaries are unsigned/un-notarized: Gatekeeper will quarantine downloads.
#   Users need to right-click > Open, or `xattr -d com.apple.quarantine hindsight-*`.
#   Proper signing requires an Apple Developer ID cert added as a repo secret.
name: Build binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Read-only by default. The build jobs install and run third-party code (the
# dependencies and PyInstaller), so they get no write access; only the job that
# attaches the binaries to the release asks for it.
permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            suffix: windows-x86_64
          - os: ubuntu-22.04
            suffix: linux-x86_64
          - os: macos-15 # Apple Silicon; pinned (not -latest) so the build env
                         # doesn't silently migrate, and older OS = wider compat
            suffix: macos-arm64
          - os: macos-15-intel
            suffix: macos-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Check tag matches pyhindsight.__version__
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION=$(python -c "import pyhindsight; print(pyhindsight.__version__)")
          if [[ "v$VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyhindsight.__version__ (v$VERSION)"
            exit 1
          fi

      # The binaries are built from requirements-build.txt, which pins every package
      # to one version and lists the hashes of its files, so a release cannot pick up
      # a dependency version nobody has looked at. --require-hashes makes pip refuse
      # anything that is not in the file. See requirements-build.in for how to refresh it.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements-build.txt

      - name: Build executables
        working-directory: spec
        run: |
          pyinstaller --distpath ../dist-ci -y hindsight.spec
          pyinstaller --distpath ../dist-ci -y hindsight_gui.spec

      - name: Smoke test
        shell: bash
        run: ./dist-ci/hindsight --help

      # pywin32 is optional at run time. Without it the exe still starts and parses,
      # and only loses the ability to decrypt cookies and passwords, so the --help
      # test above cannot tell. Look for the module in the exe itself.
      - name: Check Windows decryption support is bundled
        if: runner.os == 'Windows'
        shell: bash
        run: |
          for exe in hindsight hindsight_gui; do
            python -m PyInstaller.utils.cliutils.archive_viewer -l "dist-ci/$exe.exe" > listing.txt
            if ! grep -qi 'win32crypt' listing.txt; then
              echo "::error::win32crypt is not bundled in $exe.exe"
              exit 1
            fi
            echo "win32crypt is bundled in $exe.exe"
          done

      - name: Rename binaries per platform
        shell: bash
        run: |
          mkdir upload
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            # Windows keeps the historical plain asset names; the .exe extension
            # differentiates it. Linux/macOS need suffixes: three extensionless
            # binaries would otherwise collide on the same asset filename.
            cp dist-ci/hindsight.exe upload/hindsight.exe
            cp dist-ci/hindsight_gui.exe upload/hindsight_gui.exe
          else
            cp dist-ci/hindsight "upload/hindsight-${{ matrix.suffix }}"
            cp dist-ci/hindsight_gui "upload/hindsight_gui-${{ matrix.suffix }}"
          fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binaries-${{ matrix.suffix }}
          path: upload/*

  attach-to-release:
    name: Attach binaries to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # to upload to, or create, the release
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binaries-* # not the sdist and wheel, which go to PyPI
          path: upload
          merge-multiple: true

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$GITHUB_REF_NAME" upload/* --clobber --repo "$GITHUB_REPOSITORY" \
            || gh release create "$GITHUB_REF_NAME" upload/* --draft --generate-notes --repo "$GITHUB_REPOSITORY"

  # Builds the sdist and wheel, and cannot publish them. Building runs third-party
  # code (build and setuptools), so it happens here, in a job with a read-only token
  # and no id-token, and the files are handed to publish-pypi as an artifact. Runs on
  # manual runs too, so the packaging can be checked without cutting a release.
  build-dist:
    name: Build sdist and wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      # requirements-dist.txt pins build and setuptools with hashes, the same way
      # requirements-build.txt does for the binaries. --no-isolation makes build use
      # them. Left to itself it installs the newest setuptools into its own environment.
      - name: Install build tools
        run: pip install --require-hashes -r requirements-dist.txt

      - name: Build sdist and wheel
        run: python -m build --no-isolation

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  # The only job that can publish to PyPI. It has no checkout and installs nothing:
  # it downloads the files build-dist made and hands them to the publish action.
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/')
    needs: [build, build-dist] # don't publish if any platform binary failed to build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pyhindsight/
    permissions:
      id-token: write # required for PyPI trusted publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-dist
          path: dist

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
